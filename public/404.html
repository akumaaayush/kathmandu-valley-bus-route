<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | KTM Bus Map</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <script>
      try {
        var theme = localStorage.getItem('ktm_transit_theme');
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      :root { --bg: #fff; --fg: #0a0a0a; --muted: #737373; --btn-bg: #0a0a0a; --btn-fg: #fff; --grid: rgb(0 0 0 / 0.07); }
      html.dark { --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; --btn-bg: #fafafa; --btn-fg: #0a0a0a; --grid: rgb(255 255 255 / 0.06); }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
        background: var(--bg); color: var(--fg); font-family: Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 22px 22px;
      }
      img { width: 64px; height: 64px; border-radius: 15px; }
      h1 { margin: 20px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
      p { margin: 8px auto 0; max-width: 22rem; font-size: 14px; line-height: 1.5; color: var(--muted); }
      a { display: inline-flex; margin-top: 20px; height: 40px; align-items: center; padding: 0 18px; border-radius: 999px; background: var(--btn-bg); color: var(--btn-fg); font-size: 13px; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>This page isn't on the map</h1>
      <p>The link may be old or mistyped. The bus map, routes and trip planner are all on the main page.</p>
      <a href="/">Open the bus map</a>
    </main>
  </body>
</html>
